[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fibonacci-qc"
version = "0.1.0"
description = "Finite-size quantum transport under local defects in a 1D Fibonacci quasicrystal."
requires-python = ">=3.9"
dependencies = [
    "numpy>1.24",
    "matplotlib>=3.7",
]

[project.scripts]
fibonacci-qc-raw = "fibonacci_qc.drivers:main_raw"
fibonacci-qc-analyze = "fibonacci_qc.drivers:main_analyze"
fibonacci-qc-figures = "fibonacci_qc.drivers:main_figures"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["fibonacci_qc*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
addopts = "-q"