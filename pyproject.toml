[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fibonacci-qc"
version = "0.1.0"
description = "Finite-size quantum transport under local defects in a 1D Fibonacci quasicrystal."
requires-python = ">=3.9"
dependencies = [
    "numpy>1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["fibonacci_qc*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"